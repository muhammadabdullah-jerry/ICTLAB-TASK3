<DOCTYPE! html>
<html>
<header>
<title>TASK-03</title>
<style>
    body{
        background-color: lightgray;
    }
    h1{
        color:red;
    }
    table{
        background-color: lightblue;
    }

</style>
</header>
<body>
    <h1>Continental Hotel Reservation Form</h1>

    <form action="/action_page.php">
        <table border="1">
            <tr>
                <td><b>Name</b></td>
                <td><input type="text" name="fname"></td>
            </tr>
            <tr>
                <td><b>email</b></td>
                <td><input type="text" name="email" value="info@continental.pk"></td>
            </tr>
            <tr>
                <td><b>Mobile no</b></td>
                <td><input type="text" name="mobile"></td>
            </tr>
            <tr>
                <td><b>Arrival Time</b></td>
                <td><input type="text" name="arrival"></td>
            </tr>
            <tr>
                <td><b>Departure</b></td>
                <td><input type="text" name="dep_date">
                    <input type="text" name="dep_date">
                </td>
            </tr>
            <tr>
                <td><b>Room Type</b></td>
                <td><input type="radio" name="room" value="single">Single
                    <input type="radio" name="room" value="double">Double<br>
                    <input type="radio" name="room" value="suite">Presidential Suite
                </td>
            </tr>
            <tr>
                <td><b>Prefrences</b></td>
                <td><input type="checkbox" name="pref1">Non-Smoking<br>
                    <input type="checkbox" name="pref2">Internet<br>
                    <input type="checkbox" name="pref3">Firm Mattress
                </td>
            </tr>
            <tr>
                <td><b>Mode of Payment</b></td>
                <td><input type="checkbox" name="pay1">Cash
                    <input type="checkbox" name="pay2">Cheque<br>
                    <input type="checkbox" name="pay3">Credit Card

                    <select name="card">
                        <option value="select">Select Card</option>
                        <option value="visa">Visa</option>
                        <option value="Master">Master Card</option>
                    </select>    
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Send data">
                </td>
            </tr>

        </table>
    </form>
</body>

</html>
